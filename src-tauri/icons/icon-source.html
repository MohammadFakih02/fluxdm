<!doctype html>
<!-- Source of the app icon. Open twice in a browser (#black and #white), screenshot at 2400x1030, then run make_icons.py next to the two screenshots. -->
<html><head><meta charset="utf-8"><style>
html,body { margin:0; padding:0; background:var(--bg,#000); }
svg { position:absolute; display:block; }
</style></head><body>
<script>
// 6i · Full heat. Sizes are laid out at fixed positions so they can be cut out exactly.
document.documentElement.style.setProperty("--bg", location.hash === "#white" ? "#fff" : "#000");
const F = "M21 12h24a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H29.5v6H41a3 3 0 0 1 3 3v2.5a3 3 0 0 1-3 3H29.5V42h5.2a1.4 1.4 0 0 1 1 2.4L26.6 54a2 2 0 0 1-3 0l-9.1-9.6a1.4 1.4 0 0 1 1-2.4H18V15a3 3 0 0 1 3-3z";
let uid = 0;
function icon(size) {
  const n = uid++, embers = size >= 48, slash = size >= 32;
  const defs = `<defs>
    <linearGradient id="t${n}" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#3a4150"/><stop offset="1" stop-color="#151922"/></linearGradient>
    <radialGradient id="h${n}" cx=".85" cy="1.05" r=".9"><stop offset="0" stop-color="#ff7a2e" stop-opacity=".65"/><stop offset="1" stop-color="#ff7a2e" stop-opacity="0"/></radialGradient>
    <linearGradient id="f${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
    <linearGradient id="tr${n}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset="1" stop-color="#ffb347" stop-opacity=".85"/></linearGradient>
    <linearGradient id="e${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".12"/><stop offset=".6" stop-color="#ff8a3d" stop-opacity=".2"/><stop offset="1" stop-color="#ff7a2e" stop-opacity=".95"/></linearGradient>
    <linearGradient id="rim${n}" x1="0" y1="0" x2="0" y2="1"><stop offset=".7" stop-color="#ff7a2e" stop-opacity="0"/><stop offset="1" stop-color="#ff9a4a" stop-opacity=".8"/></linearGradient>
    <mask id="k${n}"><rect width="64" height="64" fill="#fff"/>${slash ? `<path d="M14 44L44 14" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>` : ""}</mask></defs>`;
  const tile = `<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#t${n})"/><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#h${n})"/>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rim${n})" opacity=".55"/><rect x="2" y="2" width="60" height="30" rx="14" fill="#fff" fill-opacity=".05"/>
    <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="13.4" fill="none" stroke="url(#e${n})" stroke-width="1.3"/>` +
    (embers ? `<g fill="#ffb347">${[[50, 46, 1.1, .8], [55, 38, .8, .55], [45, 54, .9, .6], [56, 52, .6, .45], [40, 49, .6, .35]].map(([x, y, r, o]) => `<circle cx="${x}" cy="${y}" r="${r}" opacity="${o}"/>`).join("")}</g>` : "");
  const mark = `<g transform="translate(6 0) skewX(-10)"><rect x="3" y="14.8" width="26" height="7.7" rx="3.85" fill="url(#tr${n})"/><rect x="7" y="27.7" width="22" height="6.4" rx="3.2" fill="url(#tr${n})" opacity=".85"/>
    <g mask="url(#k${n})"><path d="${F}" fill="url(#f${n})" transform="translate(10.5 4.5) scale(.86)"/></g></g>`;
  // the tile spans 2..62 of 64; drawn edge to edge so small sizes use every pixel
  return `<svg width="${size}" height="${size}" viewBox="2 2 60 60">${defs}${tile}${mark}</svg>`;
}
const SIZES = [1024, 512, 256, 128, 96, 64, 48, 40, 32, 24, 20, 16];
let x = 0;
const layout = [];
for (const s of SIZES) {
  document.body.insertAdjacentHTML("beforeend", icon(s));
  const el = document.body.lastElementChild; el.style.left = x + "px"; el.style.top = "0px";
  layout.push([s, x]); x += s + 8;
}
document.title = JSON.stringify(layout);
</script>
</body></html>
