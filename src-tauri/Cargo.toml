[package]
name = "fluxdm"
version = "2.2.1"
description = "A small, fast download manager for Windows"
authors = ["Mohammad Fakih"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls", "http-api-client"] }
md-5 = "0.10"
parking_lot = "0.12.5"
png = "0.18.1"
qrcode = "0.14.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "process"] }
tokio-util = "0.7.19"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
winreg = "0.55"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_System_Com",
] }
windows-core = "0.62"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
opt-level = 3

# Patched copies of the torrent engine (librqbit 9.0.1): tracker scrape numbers, peer piece counts,
# file priorities, read-only files while seeding and BEP 55 holepunch. See vendor/PATCHES.md.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-peer-protocol = { path = "vendor/librqbit-peer-protocol" }
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
