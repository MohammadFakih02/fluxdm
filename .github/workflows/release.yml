# Push a tag like v2.0.1 → builds on Windows and publishes a GitHub release with
# FluxDM-Setup-<version>.exe, FluxDM.exe and FluxDM.exe.sha256 (what FluxDM's
# "Check for updates" downloads and verifies). Keep the tag equal to the version in
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      - name: Build
        shell: pwsh
        run: ./build-setup.ps1

      # The release notes are this version's section of CHANGELOG.md ("## 2.2.0 — date" up to the next "## ").
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $out = @(); $on = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## ') { if ($on) { break }; $on = $l -match "^## $([regex]::Escape($v))\b"; continue }
            if ($on) { $out += $l }
          }
          if (-not $out) { $out = @("See CHANGELOG.md.") }
          $out += "", "**Download:** ``FluxDM-Setup-$v.exe`` (installer) or ``FluxDM.exe`` (portable). Not code-signed: if SmartScreen warns, click More info, then Run anyway."
          Set-Content notes.md ($out -join "`n").Trim()

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: FluxDM ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/FluxDM-Setup-*.exe
            dist/FluxDM.exe
            dist/FluxDM.exe.sha256
